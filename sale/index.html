<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clutter Byte — Sale</title>
  <meta name="description" content="View Clutter Byte estate sale photos, schedule, and sale details."/>
  <meta name="theme-color" content="#1c1c1a"/>
  <meta property="og:title" content="Clutter Byte — Sale"/>
  <meta property="og:description" content="View Clutter Byte estate sale photos, schedule, and sale details."/>
  <meta property="og:type" content="article"/>
  <meta property="og:url" content="https://clutterbyte.com/sale/"/>
  <meta property="og:image" content="https://clutterbyte.com/hemet-pics/photo1.jpg"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <link rel="canonical" href="https://clutterbyte.com/sale/"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="../css/theme.css"/>
</head>
<body>

  <header class="cb-header">
    <a href="/home" class="logo" id="sale-home-link">
      <span class="logo-icon"></span>
      <span class="logo-text">Clutter Byte</span>
    </a>
    <div class="header-right">
      <a href="/home-es" class="admin-link" id="sale-lang-link">ES</a>
      <button class="header-contact-btn" id="header-contact-btn">Contact ↗</button>
    </div>
  </header>

  <div class="phone-overlay" id="phone-overlay" role="dialog" aria-label="Contact">
    <div class="phone-overlay-left">
      <span class="phone-overlay-label">Text anytime</span>
      <a href="sms:+13233019200" class="phone-overlay-number">(323) 301-9200</a>
      <span class="phone-overlay-sub shine-text">Hosting a garage or estate sale? We can list it here for you.</span>
    </div>
    <button class="phone-overlay-close" id="phone-overlay-close">Close ✕</button>
  </div>
  <div class="phone-backdrop" id="phone-backdrop"></div>

  <main>
    <div class="page-header">
      <a href="/home" class="btn back" id="sale-back-link">← Home</a>
      <h2 class="page-title">Sale</h2>
      <p class="page-meta" id="photo-count"></p>
    </div>

    <section class="carousel-section" id="carousel-section"></section>
  </main>

  <footer class="cb-footer">
    <span>© Clutter Byte</span>
    <a href="/home" class="footer-link" id="sale-footer-link">← Home</a>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lb-close" id="lb-close">Close ✕</button>
    <div class="lb-nav">
      <button class="lb-arrow" id="lb-prev" aria-label="Previous">&#8592;</button>
      <button class="lb-arrow" id="lb-next" aria-label="Next">&#8594;</button>
    </div>
    <img class="lightbox-img" id="lb-img" src="" alt=""/>
    <span class="lb-hint">esc · ← → to navigate</span>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var LOCATION = params.get('city') || 'hemet';
    var LANG = params.get('lang') === 'es' ? 'es' : 'en';
    if (LANG === 'es') {
      document.documentElement.lang = 'es';
      document.getElementById('sale-home-link').href = '/home-es';
      document.getElementById('sale-back-link').href = '/home-es';
      document.getElementById('sale-back-link').textContent = '← Inicio';
      document.getElementById('sale-footer-link').href = '/home-es';
      document.getElementById('sale-footer-link').textContent = '← Inicio';
      document.getElementById('sale-lang-link').href = '/sale/?city=' + encodeURIComponent(LOCATION);
      document.getElementById('sale-lang-link').textContent = 'EN';
      document.getElementById('header-contact-btn').textContent = 'Contacto ↗';
      document.querySelector('.phone-overlay-label').textContent = 'Escribe cuando quieras';
      document.querySelector('.phone-overlay-sub').textContent = '¿Organizando una venta de garaje o bienes? Podemos publicarla aquí.';
      document.getElementById('phone-overlay-close').textContent = 'Cerrar ✕';
      document.getElementById('lb-close').textContent = 'Cerrar ✕';
      document.getElementById('lb-prev').setAttribute('aria-label', 'Anterior');
      document.getElementById('lb-next').setAttribute('aria-label', 'Siguiente');
      document.querySelector('.lb-hint').textContent = 'esc · ← → para navegar';
    } else {
      document.getElementById('sale-lang-link').href = '/sale/?city=' + encodeURIComponent(LOCATION) + '&lang=es';
    }
  </script>
  <script src="../js/ed-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-cms.js"></script>
  <script src="../js/photos.js"></script>
  <script src="../js/main.js"></script>

</body>
</html>
